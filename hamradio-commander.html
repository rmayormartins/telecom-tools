const { useState, useEffect, useRef, useCallback, useMemo, memo } = React;

/* ════════════════════════════════════════════════════════════════
   HAMRADIO COMMANDER v3 — PROPAGATION CONTROL

   • NOAA SWPC  — solar/geomag/wind/particles/scales/aurora (CORS open)
   • GIRO/KC2G  — real ionosonde foF2 / MUF(3000) / TEC      (CORS open)
   • PSK Reporter — reception spots (needs a CORS proxy; optional)
   ════════════════════════════════════════════════════════════════ */

const BANDS=[
  {name:"160m",freq:1.9,color:"#db61a2"},{name:"80m",freq:3.6,color:"#f85149"},
  {name:"60m",freq:5.35,color:"#f0883e"},{name:"40m",freq:7.1,color:"#f0883e"},
  {name:"30m",freq:10.1,color:"#d29922"},{name:"20m",freq:14.1,color:"#3fb950"},
  {name:"17m",freq:18.1,color:"#58a6ff"},{name:"15m",freq:21.2,color:"#79c0ff"},
  {name:"12m",freq:24.9,color:"#a371f7"},{name:"10m",freq:28.5,color:"#bc8cff"},
  {name:"6m",freq:50.1,color:"#4dd0e1"},
];
function bandOf(mhz){
  if(mhz>=1.8&&mhz<=2)return"160m";if(mhz>=3.5&&mhz<=4)return"80m";if(mhz>=5&&mhz<=5.5)return"60m";
  if(mhz>=7&&mhz<=7.3)return"40m";if(mhz>=10&&mhz<=10.2)return"30m";if(mhz>=14&&mhz<=14.4)return"20m";
  if(mhz>=18&&mhz<=18.2)return"17m";if(mhz>=21&&mhz<=21.5)return"15m";if(mhz>=24.8&&mhz<=25)return"12m";
  if(mhz>=28&&mhz<=29.7)return"10m";if(mhz>=50&&mhz<=54)return"6m";if(mhz>=144&&mhz<=148)return"2m";return mhz.toFixed(1);
}
const QTH_PRESETS=[
  {name:"Itajaí / GG52 (PU4MAY)",lat:-26.9,lon:-48.66},
  {name:"São José / IFSC",lat:-27.59,lon:-48.61},

];
const CONTINENTS={
  namerica:[[-130,50],[-124,48],[-120,35],[-115,32],[-105,30],[-97,26],[-90,29],[-82,25],[-80,27],[-74,40],[-67,45],[-60,47],[-65,60],[-75,65],[-95,72],[-120,72],[-138,62],[-160,55],[-168,65],[-155,71],[-138,62],[-130,50]],
  samerica:[[-80,10],[-68,11],[-60,8],[-50,2],[-42,-8],[-35,-15],[-40,-22],[-48,-26],[-53,-33],[-65,-40],[-68,-53],[-72,-48],[-72,-35],[-70,-26],[-70,-18],[-77,-12],[-80,-5],[-80,2],[-75,8],[-80,10]],
  africa:[[-15,12],[-16,20],[-8,30],[-2,35],[10,37],[15,30],[30,30],[38,28],[42,18],[48,8],[45,0],[40,-10],[33,-25],[28,-33],[20,-33],[15,-25],[10,-10],[5,0],[-5,5],[-12,8],[-15,12]],
  eurasia:[[-10,36],[0,38],[15,38],[28,37],[40,42],[50,38],[60,42],[70,38],[80,28],[90,22],[100,14],[107,12],[115,22],[122,32],[130,42],[140,42],[150,53],[162,60],[180,68],[170,72],[140,70],[110,68],[80,72],[60,68],[40,65],[28,68],[20,55],[12,56],[5,54],[5,48],[2,49],[-5,44],[-10,44],[-10,36]],
  australia:[[115,-35],[120,-20],[130,-13],[135,-13],[142,-15],[148,-18],[153,-30],[148,-38],[140,-37],[132,-33],[125,-34],[118,-35],[115,-35]],
};

// ─── MATH ───────────────────────────────────────────────────
const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
function gcDist(la1,lo1,la2,lo2){const R=6371,dLa=toRad(la2-la1),dLo=toRad(lo2-lo1);
  const a=Math.sin(dLa/2)**2+Math.cos(toRad(la1))*Math.cos(toRad(la2))*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function bearing(la1,lo1,la2,lo2){const y=Math.sin(toRad(lo2-lo1))*Math.cos(toRad(la2));
  const x=Math.cos(toRad(la1))*Math.sin(toRad(la2))-Math.sin(toRad(la1))*Math.cos(toRad(la2))*Math.cos(toRad(lo2-lo1));
  return (toDeg(Math.atan2(y,x))+360)%360;}
function solarSubPoint(date){
  const now=date||new Date();const jd=now.getTime()/86400000+2440587.5,n=jd-2451545.0;
  const L=(280.46+0.9856474*n)%360,g=toRad((357.528+0.9856003*n)%360);
  const lam=toRad(L+1.915*Math.sin(g)+0.02*Math.sin(2*g)),eps=toRad(23.439-0.0000004*n);
  const decl=toDeg(Math.asin(Math.sin(eps)*Math.sin(lam)));
  const ra=toDeg(Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)));
  const gmst=(280.46061837+360.98564736629*n)%360;
  const lon=((ra-gmst+540)%360)-180;return {lat:decl,lon};
}
function cosZenith(lat,lon,sun){const h=toRad(((lon-sun.lon+540)%360)-180);
  return Math.sin(toRad(lat))*Math.sin(toRad(sun.lat))+Math.cos(toRad(lat))*Math.cos(toRad(sun.lat))*Math.cos(h);}
// Maidenhead grid -> lat/lon
function gridToLatLon(g){
  if(!g||g.length<4)return null;g=g.toUpperCase();
  const A=c=>c.charCodeAt(0)-65;
  let lon=A(g[0])*20-180, lat=A(g[1])*10-90;
  lon+=parseInt(g[2])*2; lat+=parseInt(g[3])*1;
  if(g.length>=6){lon+=A(g[4])*(2/24)+(1/24);lat+=A(g[5])*(1/24)+(0.5/24);}
  else{lon+=1;lat+=0.5;}
  if(isNaN(lon)||isNaN(lat))return null;return {lat,lon};
}

// ─── PROPAGATION MODEL ──────────────────────────────────────
function estimateFoF2(sfi,kIndex,cosX){
  const day=Math.max(0,cosX);const base=2.0+0.045*sfi;
  const solar=base*(0.42+0.58*Math.pow(day,0.5));
  return Math.max(1.8,solar*Math.max(0.55,1-kIndex*0.06));
}
function estimateMUF(sfi,kIndex,distKm,cosX){
  const foF2=estimateFoF2(sfi,kIndex,cosX);
  const hops=Math.max(1,Math.ceil(distKm/4000));const hopDist=distKm/hops;
  const M=Math.min(3.4,1+2.5*(1-Math.exp(-hopDist/1500)));
  return Math.max(2,Math.min(foF2*M,52));
}
function dRapHAF(xrayFlux,cosX){const day=Math.max(0,cosX);const I=Math.max(1e-9,xrayFlux);
  return 6*Math.pow(I/1e-7,0.25)*Math.pow(day,0.75);}
function dLayerAbsorption(freqMHz,haf){if(haf<=0.1)return 0;return Math.min(60,Math.pow(haf/freqMHz,2));}

// ─── SWPC DATA LAYER ────────────────────────────────────────
const SWPC="https://services.swpc.noaa.gov";
const FEEDS={
  kindex:`${SWPC}/products/noaa-planetary-k-index.json`,
  kfore:`${SWPC}/products/noaa-planetary-k-index-forecast.json`,
  scales:`${SWPC}/products/noaa-scales.json`,
  plasma1:`${SWPC}/products/solar-wind/plasma-1-day.json`,
  mag1:`${SWPC}/products/solar-wind/mag-1-day.json`,
  plasma7:`${SWPC}/products/solar-wind/plasma-7-day.json`,
  mag7:`${SWPC}/products/solar-wind/mag-7-day.json`,
  xray1:`${SWPC}/json/goes/primary/xrays-1-day.json`,
  xray7:`${SWPC}/json/goes/primary/xrays-7-day.json`,
  proton:`${SWPC}/json/goes/primary/integral-protons-1-day.json`,
  electron:`${SWPC}/json/goes/primary/integral-electrons-1-day.json`,
  f107sum:`${SWPC}/products/summary/10cm-flux.json`,
  f10730:`${SWPC}/products/10cm-flux-30-day.json`,
  cycle:`${SWPC}/json/solar-cycle/observed-solar-cycle-indices.json`,
  dst:`${SWPC}/products/kyoto-dst.json`,
  alerts:`${SWPC}/products/alerts.json`,
  aurora:`${SWPC}/json/ovation_aurora_latest.json`,
};
const IONO_URL="https://prop.kc2g.com/api/stations.json";

function fetchJSON(url,ms=12000){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{signal:ctrl.signal,cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).finally(()=>clearTimeout(t));
}
function rowsToObjs(arr){if(!Array.isArray(arr)||arr.length<2||!Array.isArray(arr[0]))return [];
  const head=arr[0];return arr.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]);return o;});}
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
function parseTime(s){if(!s)return null;const t=Date.parse(s.replace(" ","T")+(/[zZ]|\+/.test(s)?"":"Z"));return isNaN(t)?null:t;}
function xrayClass(flux){if(flux==null)return "—";const f=flux;let band,div;
  if(f<1e-7){band="A";div=1e-8;}else if(f<1e-6){band="B";div=1e-7;}
  else if(f<1e-5){band="C";div=1e-6;}else if(f<1e-4){band="M";div=1e-5;}else{band="X";div=1e-4;}
  return band+(f/div).toFixed(1);}
function downsample(arr,target){if(arr.length<=target)return arr;const step=arr.length/target,out=[];
  for(let i=0;i<target;i++)out.push(arr[Math.floor(i*step)]);out.push(arr[arr.length-1]);return out;}

async function loadSpaceWeather(){
  const keys=Object.keys(FEEDS);
  const results=await Promise.allSettled(keys.map(k=>fetchJSON(FEEDS[k])));
  const data={};const ok={};
  keys.forEach((k,i)=>{if(results[i].status==="fulfilled"){data[k]=results[i].value;ok[k]=true;}else ok[k]=false;});
  const out={ts:Date.now(),ok,series:{}};
  if(data.kindex){const ki=data.kindex.filter(d=>d.time_tag);
    out.series.kp=ki.map(d=>[parseTime(d.time_tag),num(d.Kp)]).filter(p=>p[0]&&p[1]!=null);
    const last=ki[ki.length-1];out.kIndex=last?num(last.Kp):null;out.aIndex=last?num(last.a_running):null;}
  if(data.kfore){const f=rowsToObjs(data.kfore);
    out.series.kpFore=f.filter(d=>(d.observed==="predicted"||d.observed==="estimated")).map(d=>[parseTime(d.time_tag),num(d.kp)]).filter(p=>p[0]&&p[1]!=null);
    const fut=f.filter(d=>d.observed==="predicted").map(d=>num(d.kp)).filter(v=>v!=null);out.kpMax3d=fut.length?Math.max(...fut):null;}
  if(data.scales){const today=data.scales["0"]||data.scales["-1"]||Object.values(data.scales)[0];
    if(today)out.scales={R:today.R||{},S:today.S||{},G:today.G||{}};}
  if(data.plasma1){const o=rowsToObjs(data.plasma1);

    out.series.swBz=downsample(bz,260);out.swBz=bz.length?bz[bz.length-1][1]:null;out.swBt=bt.length?bt[bt.length-1][1]:null;}
  if(data.plasma7){const o=rowsToObjs(data.plasma7);out.series.swSpeed7=downsample(o.map(d=>[parseTime(d.time_tag),num(d.speed)]).filter(p=>p[0]&&p[1]!=null),320);}
  if(data.mag7){const o=rowsToObjs(data.mag7);out.series.swBz7=downsample(o.map(d=>[parseTime(d.time_tag),num(d.bz_gsm)]).filter(p=>p[0]&&p[1]!=null),320);}
  const xseries=raw=>raw.filter(d=>d.energy==="0.1-0.8nm").map(d=>[parseTime(d.time_tag),num(d.flux)]).filter(p=>p[0]&&p[1]!=null);
  if(data.xray1){const xs=xseries(data.xray1);out.series.xray=downsample(xs,300);
    out.xrayFlux=xs.length?xs[xs.length-1][1]:null;out.xrayClass=xrayClass(out.xrayFlux);
    const peak=xs.length?Math.max(...xs.map(p=>p[1])):null;out.xrayPeak=peak;out.xrayPeakClass=xrayClass(peak);}
  if(data.xray7){out.series.xray7=downsample(xseries(data.xray7),360);}
  if(data.proton){const p=data.proton.filter(d=>d.energy===">=10 MeV").map(d=>[parseTime(d.time_tag),num(d.flux)]).filter(x=>x[0]&&x[1]!=null);
    out.proton10=p.length?p[p.length-1][1]:null;out.series.proton=downsample(p,200);}

  if(data.f107sum)out.sfi=num(data.f107sum.Flux);
  if(data.f10730){const o=Array.isArray(data.f10730)&&Array.isArray(data.f10730[0])?rowsToObjs(data.f10730):data.f10730;
    const s=(o||[]).map(d=>[parseTime(d.time_tag),num(d.flux)]).filter(p=>p[0]&&p[1]!=null);out.series.f107=s;if(out.sfi==null&&s.length)out.sfi=s[s.length-1][1];}
  if(data.cycle){const c=data.cycle.filter(d=>d.ssn!=null);const last=c[c.length-1];
    if(last){out.ssn=Math.round(num(last.ssn));out.ssnSmooth=last.smoothed_ssn!=null?Math.round(num(last.smoothed_ssn)):null;}
    out.series.ssn=c.slice(-60).map(d=>[parseTime(d.time_tag+"-01"),num(d.ssn)]).filter(p=>p[0]&&p[1]!=null);}
  if(data.dst){const o=Array.isArray(data.dst)&&Array.isArray(data.dst[0])?rowsToObjs(data.dst):data.dst;
    const s=(o||[]).map(d=>[parseTime(d.time_tag),num(d.dst!=null?d.dst:d.Dst)]).filter(p=>p[0]&&p[1]!=null);out.series.dst=s;out.dst=s.length?s[s.length-1][1]:null;}
  if(data.alerts)out.alerts=data.alerts.slice(0,40).map(d=>({issued:d.issue_datetime,msg:(d.message||"").trim(),id:d.product_id||""}));
  if(data.aurora&&Array.isArray(data.aurora.coordinates)){
    const pts=[];for(const c of data.aurora.coordinates){if(c[2]>=8){let lon=c[0];if(lon>180)lon-=360;pts.push([lon,c[1],c[2]]);}}
    out.aurora=pts;out.auroraTime=data.aurora["Observation Time"];
    out.auroraPower=data.aurora.coordinates.reduce((a,c)=>a+(c[2]>5?c[2]:0),0);}
  out.anyOk=Object.values(ok).some(Boolean);
  return out;
}

async function loadSpots(callsign,dir,proxy,minutes){
  if(!callsign)return {error:"no callsign"};
  const q=`https://retrieve.pskreporter.info/query?${dir}Callsign=${encodeURIComponent(callsign)}&flowStartSeconds=-${(minutes||60)*60}&rronly=1&noactive=1`;
  const url=proxy?(proxy.includes("{url}")?proxy.replace("{url}",encodeURIComponent(q)):proxy+encodeURIComponent(q)):q;
  try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),14000);
    const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const txt=await r.text();
    const doc=new DOMParser().parseFromString(txt,"text/xml");
    if(doc.querySelector("parsererror"))throw new Error("bad XML");
    const reps=Array.from(doc.querySelectorAll("receptionReport"));
    const spots=reps.map(n=>({
      rx:n.getAttribute("receiverCallsign"),rxGrid:n.getAttribute("receiverLocator"),
      tx:n.getAttribute("senderCallsign"),txGrid:n.getAttribute("senderLocator"),
      freq:parseInt(n.getAttribute("frequency"))/1e6,mode:n.getAttribute("mode"),
      snr:n.getAttribute("sNR"),t:parseInt(n.getAttribute("flowStartSeconds"))*1000,
      dxcc:n.getAttribute("receiverDXCC")||n.getAttribute("senderDXCC")||"",
    })).filter(s=>s.freq>0);
    return {spots};
  }catch(e){return {error:e.message||"fetch failed"};}
}

// ─── TIME-SERIES CHART ──────────────────────────────────────
const TimeChart=memo(({series,height=78,yFmt,yLog=false,thresholds=[],fill=true,baseline})=>{
  const ref=useRef(null),wrapRef=useRef(null);
  useEffect(()=>{
    const c=ref.current,wrap=wrapRef.current;if(!c||!wrap)return;
    const W=wrap.clientWidth||300,H=height,dpr=window.devicePixelRatio||1;
    c.width=W*dpr;c.height=H*dpr;c.style.height=H+"px";
    const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const all=series.flatMap(s=>s.points||[]);
    if(!all.length){ctx.fillStyle="#484f58";ctx.font="10px ui-monospace";ctx.fillText("no data",10,H/2);return;}
    const xs=all.map(p=>p[0]),tMin=Math.min(...xs),tMax=Math.max(...xs);
    let vMin=Math.min(...all.map(p=>p[1])),vMax=Math.max(...all.map(p=>p[1]));
    if(baseline!=null){vMin=Math.min(vMin,baseline);vMax=Math.max(vMax,baseline);}
    thresholds.forEach(t=>{vMin=Math.min(vMin,t.v);vMax=Math.max(vMax,t.v);});
    if(yLog){vMin=Math.log10(Math.max(vMin,1e-9));vMax=Math.log10(Math.max(vMax,1e-9));}
    const pad=(vMax-vMin)*0.12||1;vMin-=pad;vMax+=pad;
    const padL=2,padR=2,padT=4,padB=12;
    const xOf=t=>padL+((t-tMin)/(tMax-tMin||1))*(W-padL-padR);
    const yOf=v=>{const vv=yLog?Math.log10(Math.max(v,1e-9)):v;return padT+(1-(vv-vMin)/(vMax-vMin||1))*(H-padT-padB);};
    ctx.strokeStyle="#161b22";ctx.lineWidth=1;
    for(let i=0;i<=3;i++){const y=padT+(i/3)*(H-padT-padB);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();}
    thresholds.forEach(t=>{const y=yOf(t.v);ctx.strokeStyle=t.color||"#30363d";ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([]);});
    if(baseline!=null){const y=yOf(baseline);ctx.strokeStyle="#30363d";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([]);}
    series.forEach(s=>{const pts=s.points;if(!pts||!pts.length)return;
      if(fill&&s.fill!==false){const g=ctx.createLinearGradient(0,padT,0,H-padB);
        g.addColorStop(0,(s.color||"#58a6ff")+"3a");g.addColorStop(1,(s.color||"#58a6ff")+"02");
        ctx.beginPath();ctx.moveTo(xOf(pts[0][0]),H-padB);pts.forEach(p=>ctx.lineTo(xOf(p[0]),yOf(p[1])));
        ctx.lineTo(xOf(pts[pts.length-1][0]),H-padB);ctx.closePath();ctx.fillStyle=g;ctx.fill();}
      ctx.beginPath();pts.forEach((p,i)=>{const x=xOf(p[0]),y=yOf(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.strokeStyle=s.color||"#58a6ff";ctx.lineWidth=1.4;ctx.lineJoin="round";ctx.stroke();
      const lp=pts[pts.length-1];ctx.fillStyle=s.color||"#58a6ff";ctx.beginPath();ctx.arc(xOf(lp[0]),yOf(lp[1]),2,0,7);ctx.fill();});
    ctx.fillStyle="#6e7681";ctx.font="9px ui-monospace";ctx.textBaseline="middle";
    const top=yLog?Math.pow(10,vMax):vMax,bot=yLog?Math.pow(10,vMin):vMin;
    ctx.fillText(yFmt?yFmt(top):top.toFixed(0),3,padT+5);ctx.fillText(yFmt?yFmt(bot):bot.toFixed(0),3,H-padB-5);
    ctx.textBaseline="alphabetic";ctx.fillStyle="#484f58";const span=tMax-tMin,oneDay=86400000;
    for(let i=0;i<=4;i++){const t=tMin+(i/4)*span,x=xOf(t),d=new Date(t);
      let lab=span>2*oneDay?`${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}`:`${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
      ctx.textAlign=i===0?"left":i===4?"right":"center";ctx.fillText(lab,Math.min(Math.max(x,padL),W-padR),H-2);}
    ctx.textAlign="left";
  });
  return <div ref={wrapRef}><canvas ref={ref}/></div>;
});

// foF2 color scale (KC2G-like)
function foF2Color(f){
  if(f==null)return "#6e7681";
  if(f<3)return "#3b6fd6";if(f<5)return "#2aa7c4";if(f<7)return "#3fb950";
  if(f<9)return "#c9c623";if(f<11)return "#f0883e";if(f<14)return "#f85149";return "#db61a2";
}

// ─── BIG MAP (greyline + ionosondes + aurora + spots) ───────
const PropMap=memo(({qth,iono,aurora,spots,spotDir,layers})=>{
  const ref=useRef(null),wrapRef=useRef(null);
  useEffect(()=>{
    const c=ref.current,wrap=wrapRef.current;if(!c||!wrap)return;
    const W=wrap.clientWidth||700,H=Math.round(W*0.5),dpr=window.devicePixelRatio||1;
    c.width=W*dpr;c.height=H*dpr;c.style.height=H+"px";
    const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
    const X=lon=>((lon+180)/360)*W,Y=lat=>((90-lat)/180)*H;
    ctx.fillStyle="#060a10";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#0f1620";ctx.lineWidth=1;
    for(let lo=-180;lo<=180;lo+=30){ctx.beginPath();ctx.moveTo(X(lo),0);ctx.lineTo(X(lo),H);ctx.stroke();}
    for(let la=-60;la<=60;la+=30){ctx.beginPath();ctx.moveTo(0,Y(la));ctx.lineTo(W,Y(la));ctx.stroke();}
    const sun=solarSubPoint();
    // night shading
    for(let px=0;px<W;px+=3)for(let py=0;py<H;py+=3){
      const lon=(px/W)*360-180,lat=90-(py/H)*180,cz=cosZenith(lat,lon,sun);
      if(cz<0.1){ctx.fillStyle=cz<-0.1?"#0a0f1799":"#10141c66";ctx.fillRect(px,py,3,3);}}
    // aurora
    if(layers.aurora&&aurora){for(const a of aurora){const v=a[2];
      ctx.fillStyle=`rgba(${v>40?255:80},${v>40?100:220},${v>40?80:120},${Math.min(0.7,v/80)})`;
      ctx.fillRect(X(a[0])-1.2,Y(a[1])-1.2,2.4,2.4);}}
    // coastlines
    ctx.strokeStyle="#2d5a4a";ctx.lineWidth=1.1;
    Object.values(CONTINENTS).forEach(poly=>{ctx.beginPath();poly.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();});
    // terminator
    ctx.strokeStyle="#d29922aa";ctx.lineWidth=1.4;ctx.beginPath();let started=false;
    for(let lon=-180;lon<=180;lon+=1){let best=null,bd=9;
      for(let lat=-89;lat<=89;lat+=2){const cz=Math.abs(cosZenith(lat,lon,sun));if(cz<bd){bd=cz;best=lat;}}
      if(best!=null){const x=X(lon),y=Y(best);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;}}
    ctx.stroke();
    // spots: great-circle from QTH to far end
    if(layers.spots&&spots&&spots.length&&qth){
      spots.forEach(s=>{const g=spotDir==="sender"?s.rxGrid:s.txGrid;const ll=gridToLatLon(g);if(!ll)return;
        // great-circle polyline
        const N=48,la1=toRad(qth.lat),lo1=toRad(qth.lon),la2=toRad(ll.lat),lo2=toRad(ll.lon);
        const d=2*Math.asin(Math.sqrt(Math.sin((la1-la2)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo1-lo2)/2)**2));
        ctx.beginPath();let px0=null;
        for(let i=0;i<=N;i++){const f=i/N;const A=d?Math.sin((1-f)*d)/Math.sin(d):1-f,B=d?Math.sin(f*d)/Math.sin(d):f;
          const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
          const y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
          const z=A*Math.sin(la1)+B*Math.sin(la2);
          const lat=toDeg(Math.atan2(z,Math.sqrt(x*x+y*y))),lon=toDeg(Math.atan2(y,x));
          const sx=X(lon),sy=Y(lat);
          if(px0!=null&&Math.abs(sx-px0)>W*0.5){ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy);}
          else if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);px0=sx;}
        ctx.strokeStyle="#58a6ff55";ctx.lineWidth=0.8;ctx.stroke();
        ctx.fillStyle="#79c0ff";ctx.beginPath();ctx.arc(X(ll.lon),Y(ll.lat),1.8,0,7);ctx.fill();});
    }
    // ionosondes
    if(layers.iono&&iono){iono.forEach(s=>{const x=X(s.lon),y=Y(s.lat),col=foF2Color(s.fof2);
      ctx.fillStyle=col;ctx.globalAlpha=Math.max(0.35,(s.cs||60)/100);
      ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle="#0d1117";ctx.font="700 8px ui-monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(s.fof2.toFixed(1),x,y);});ctx.textAlign="left";ctx.textBaseline="alphabetic";}
    // sun + QTH
    ctx.fillStyle="#ffd33d";ctx.beginPath();ctx.arc(X(sun.lon),Y(sun.lat),4,0,7);ctx.fill();
    ctx.strokeStyle="#ffd33d66";ctx.beginPath();ctx.arc(X(sun.lon),Y(sun.lat),9,0,7);ctx.stroke();
    if(qth){const qx=X(qth.lon),qy=Y(qth.lat);ctx.strokeStyle="#58a6ff";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(qx,qy,5,0,7);ctx.stroke();ctx.fillStyle="#58a6ff";ctx.beginPath();ctx.arc(qx,qy,2,0,7);ctx.fill();}
  });
  return <div className="map-wrap" ref={wrapRef}><canvas ref={ref}/></div>;
});

    const [d,io]=await Promise.all([loadSpaceWeather(),loadIonosondes()]);
    if(!d.anyOk)setErr("All NOAA feeds unreachable (network/CORS).");
    setSw(d);setIono(io);setLastFetch(new Date());setLoading(false);
  },[]);
  const fetchSpots=useCallback(async()=>{
    setSpotsLoading(true);setSpotErr(null);
    const r=await loadSpots(callsign.trim().toUpperCase(),spotDir,proxy.trim(),60);
    if(r.error){setSpotErr(r.error);setSpots(null);}else{setSpots(r.spots);}
    setSpotsLoading(false);
  },[callsign,spotDir,proxy]);

  useEffect(()=>{refresh();const t=setInterval(refresh,5*60*1000);return()=>clearInterval(t);},[refresh]);
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);

  const sun=useMemo(()=>solarSubPoint(now),[now]);
  const cosX=useMemo(()=>cosZenith(qth.lat,qth.lon,sun),[qth,sun]);
  const utc=now.toUTCString().slice(17,25),dateUtc=now.toUTCString().slice(5,16);
  const sfi=sw?.sfi??null,kp=sw?.kIndex??null;
  const haf=sw?.xrayFlux!=null?dRapHAF(sw.xrayFlux,cosX):dRapHAF(2e-7,cosX);
  const muf3000=sfi!=null?estimateMUF(sfi,kp??0,3000,cosX):null;
  const foF2=sfi!=null?estimateFoF2(sfi,kp??0,cosX):null;
  const storm=geoStormLabel(kp),isDay=cosX>0.05;

  // nearest ionosondes
  const nearIono=useMemo(()=>{if(!iono)return [];
    return iono.map(s=>({...s,d:gcDist(qth.lat,qth.lon,s.lat,s.lon)})).sort((a,b)=>a.d-b.d).slice(0,6);},[iono,qth]);
  const closest=nearIono[0];

  const speedSeries=win==="1D"?sw?.series.swSpeed:sw?.series.swSpeed7;
  const bzSeries=win==="1D"?sw?.series.swBz:sw?.series.swBz7;
  const xraySeries=win==="1D"?sw?.series.xray:sw?.series.xray7;
  const connCount=sw?Object.values(sw.ok).filter(Boolean).length:0,connTotal=Object.keys(FEEDS).length;

  // spots summary by band
  const spotBands=useMemo(()=>{if(!spots)return [];const m={};
    spots.forEach(s=>{const b=bandOf(s.freq);m[b]=(m[b]||0)+1;});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[spots]);

  const tg=(k)=>setLayers(l=>({...l,[k]:!l[k]}));

  return <div className="wrap">
    <div className="topbar">
      <div className="brand"><h1>HAMRADIO COMMANDER</h1><span className="v">v3</span><span className="sub">Propagation Control</span></div>
      <div className="topmeta">
        <div className="tab-bar">{["1D","7D","30D"].map(w=><button key={w} className={"tab-btn"+(win===w?" active":"")} onClick={()=>setWin(w)}>{w}</button>)}</div>
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:10}}>
          <span className="led-dot" style={{background:err?"#f85149":loading?"#d29922":"#3fb950",boxShadow:`0 0 8px ${err?"#f85149":loading?"#d29922":"#3fb950"}`}}></span>
          <span className="muted">{loading?"SYNC":err?"PARTIAL":`LIVE ${connCount}/${connTotal}`}</span>
        </div>
        <div style={{textAlign:"right"}}><div className="utc">{utc}<small>UTC · {dateUtc}</small></div></div>
        <button className="btn btn-go" onClick={refresh} disabled={loading}>{loading?<span className="spinner"></span>:"⟳ SYNC"}</button>
      </div>
    </div>

    {err && <div className="console-card" style={{borderColor:"#f8514966"}}><span className="badge b-poor">FEED ERROR</span> <span className="muted">{err} Showing whatever loaded; retry on next cycle.</span></div>}

    <div className="grid-main">
      {/* LEFT */}
      <div>
        <Card title="◉ Solar Activity" tag={sw?.anyOk?"SWPC":"—"} tagClass={sw?.anyOk?"b-good":"b-off"}>
          <div className="stat-grid">
            <Stat label="Solar Flux (SFI)" value={sfi!=null?Math.round(sfi):"—"} unit="sfu" color="#3fb950"/>
            <Stat label="Sunspot No (SSN)" value={sw?.ssn!=null?sw.ssn:"—"} color="#d29922"/>
          </div>
          <div style={{marginTop:10}}>
            <Row label="X-ray flux (now)" value={sw?.xrayClass||"—"} color={sw?.xrayFlux>=1e-5?"#f85149":sw?.xrayFlux>=1e-6?"#d29922":"#3fb950"}/>
            <Row label="X-ray peak (24h)" value={sw?.xrayPeakClass||"—"}/>
            <Row label="SSN smoothed" value={sw?.ssnSmooth!=null?sw.ssnSmooth:"—"}/>
            <Row label="Cycle phase" value={sfi!=null?(sfi>150?"High":sfi>110?"Moderate":"Low"):"—"}/>
          </div>
        </Card>
        <Card title="◉ NOAA Scales (today)" tag={sw?.ok.scales?"R/S/G":"—"} tagClass={sw?.ok.scales?"b-good":"b-off"}>
          <div className="scale-cells">
            {[["R","Radio Blackout",sw?.scales?.R],["S","Solar Radiation",sw?.scales?.S],["G","Geomag Storm",sw?.scales?.G]].map(([k,nm,o])=>{
              const lv=o?.Scale!=null?o.Scale:null;const col=lv==null||lv==="0"?"#3fb950":parseInt(lv)>=4?"#f85149":parseInt(lv)>=2?"#f0883e":"#d29922";
              return <div className="scale-cell" key={k}><div className="lv" style={{color:col}}>{lv!=null?k+lv:"—"}</div><div className="nm">{nm}</div><div className="dx">{lv==null||lv==="0"?"none":(o?.Text||"")}</div></div>;})}
          </div>
        </Card>
        <Card title="◉ Particle Flux (GOES)" tag={sw?.ok.proton?"GOES":"—"} tagClass={sw?.ok.proton?"b-good":"b-off"}>
          <Row label="Proton ≥10 MeV" value={sw?.proton10!=null?sw.proton10.toExponential(2)+" pfu":"—"} color={sw?.proton10>=10?"#f85149":"#3fb950"}/>
          <Row label="Electron ≥2 MeV" value={sw?.electron2!=null?sw.electron2.toExponential(2):"—"}/>
          <Row label="Proton event" value={sw?.proton10>=10?"S1+ in progress":"below threshold"} color={sw?.proton10>=10?"#f85149":"#6e7681"}/>
        </Card>
        <Card title="◉ Geomagnetic Field" tag={sw?.ok.kindex?"KYOTO/SWPC":"—"} tagClass={sw?.ok.kindex?"b-good":"b-off"}>
          <div className="stat-grid"><Stat label="Planetary Kp" value={kp!=null?kp.toFixed(1):"—"} color={kpColor(kp||0)}/><Stat label="A-index (est)" value={sw?.aIndex!=null?sw.aIndex:"—"} color="#58a6ff"/></div>
          <div style={{marginTop:8}}><span className={"badge "+storm.c}>{storm.t}</span>{sw?.dst!=null&&<span className="badge b-info" style={{marginLeft:6}}>Dst {Math.round(sw.dst)} nT</span>}</div>
          <div style={{marginTop:6,fontSize:9,color:"#6e7681"}}>Kp forecast max (3d): <b style={{color:kpColor(sw?.kpMax3d||0)}}>{sw?.kpMax3d!=null?sw.kpMax3d.toFixed(1):"—"}</b></div>
        </Card>
        <Card title="◉ Aurora (OVATION)" tag={sw?.ok.aurora?"NOAA":"—"} tagClass={sw?.ok.aurora?"b-good":"b-off"}>
          <Row label="Active aurora cells" value={sw?.aurora?sw.aurora.length:"—"}/>
          <Row label="Hemispheric proxy" value={sw?.auroraPower!=null?Math.round(sw.auroraPower):"—"}/>
          <Row label="Observation" value={sw?.auroraTime?sw.auroraTime.slice(11,16)+"Z":"—"}/>
          <div style={{fontSize:9,color:"#6e7681",marginTop:5}}>Oval drawn on the map. High activity (Kp↑) can enable auroral-E and degrade polar HF paths.</div>
        </Card>
      </div>

      {/* CENTER */}
      <div>
        <Card title="◉ Solar Wind" tag={sw?.ok.plasma1?"DSCOVR L1":"—"} tagClass={sw?.ok.plasma1?"b-good":"b-off"} right={<span className="muted" style={{fontSize:9,marginRight:8}}>{win} window</span>}>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:8}}>
            <div><span className="stat-big" style={{fontSize:22,color:"#79c0ff"}}>{sw?.swSpeed!=null?Math.round(sw.swSpeed):"—"}</span><span className="stat-unit">km/s</span><div className="stat-label">wind speed</div></div>
            <div><span className="stat-big" style={{fontSize:22,color:"#a371f7"}}>{sw?.swDensity!=null?sw.swDensity.toFixed(1):"—"}</span><span className="stat-unit">p/cm³</span><div className="stat-label">density</div></div>
            <div><span className="stat-big" style={{fontSize:22,color:sw?.swBz<0?"#f85149":"#3fb950"}}>{sw?.swBz!=null?sw.swBz.toFixed(1):"—"}</span><span className="stat-unit">nT</span><div className="stat-label">Bz (IMF)</div></div>
            <div><span className="stat-big" style={{fontSize:22,color:"#d29922"}}>{sw?.swBt!=null?sw.swBt.toFixed(1):"—"}</span><span className="stat-unit">nT</span><div className="stat-label">Bt total</div></div>
          </div>
          <div className="chart-box"><div className="chart-cap"><span className="t">Wind Speed</span><span className="v" style={{color:"#79c0ff"}}>{sw?.swSpeed!=null?Math.round(sw.swSpeed)+" km/s":""}</span></div><TimeChart series={[{points:speedSeries||[],color:"#79c0ff"}]} yFmt={v=>Math.round(v)}/></div>
          <div className="chart-box"><div className="chart-cap"><span className="t">IMF Bz (red = southward)</span><span className="v" style={{color:sw?.swBz<0?"#f85149":"#3fb950"}}>{sw?.swBz!=null?sw.swBz.toFixed(1)+" nT":""}</span></div><TimeChart series={[{points:bzSeries||[],color:sw?.swBz<0?"#f85149":"#3fb950"}]} baseline={0} yFmt={v=>v.toFixed(0)}/></div>
        </Card>
        <Card title="◉ Geomagnetic — Kp History + Forecast" tag="3-HOUR" tagClass="b-info">
          <KpBars obs={sw?.series.kp} fore={sw?.series.kpFore}/>
          <div style={{fontSize:9,color:"#6e7681",marginTop:4}}>Solid = observed · outlined = NOAA forecast · dashed = G1 storm (Kp 5)</div>
        </Card>
        <Card title="◉ GOES X-ray Flux (0.1–0.8 nm)" tag={sw?.ok.xray1?"GOES":"—"} tagClass={sw?.ok.xray1?"b-good":"b-off"} right={<span className="v" style={{fontSize:11,color:sw?.xrayFlux>=1e-5?"#f85149":"#3fb950",marginRight:8}}>{sw?.xrayClass}</span>}>
          <TimeChart series={[{points:xraySeries||[],color:"#f0883e"}]} yLog={true} height={92} thresholds={[{v:1e-6,color:"#3fb95044"},{v:1e-5,color:"#d2992066"},{v:1e-4,color:"#f8514966"}]} yFmt={v=>xrayClass(v)}/>
          <div style={{fontSize:9,color:"#6e7681",marginTop:2}}>Lines: C/M/X thresholds. Flares ionize the D-layer → sudden HF blackout on the sunlit side.</div>
        </Card>
        {win==="30D" && <Card title="◉ Solar Flux 10.7 cm — 30 day" tag="F10.7" tagClass="b-info"><TimeChart series={[{points:sw?.series.f107||[],color:"#3fb950"}]} height={84} yFmt={v=>Math.round(v)}/></Card>}
        {win==="30D" && <Card title="◉ Sunspot Number — recent" tag="SSN" tagClass="b-info"><TimeChart series={[{points:sw?.series.ssn||[],color:"#d29922"}]} height={84} yFmt={v=>Math.round(v)}/></Card>}
        {win!=="30D" && sw?.dst!=null && <Card title="◉ Dst Index (Kyoto)" tag="RING CURRENT" tagClass="b-info">
          <TimeChart series={[{points:sw?.series.dst||[],color:"#bc8cff"}]} height={74} baseline={0} yFmt={v=>Math.round(v)}/>
          <div style={{fontSize:9,color:"#6e7681",marginTop:2}}>Strongly negative Dst = intense magnetic storm / ring current.</div>
        </Card>}
      </div>

      {/* RIGHT */}
      <div>
        <Card title="◉ QTH / Observer">
          <label className="fld">Location</label>
          <select className="input-field" value={qthIdx} onChange={e=>setQthIdx(+e.target.value)}>{QTH_PRESETS.map((q,i)=><option key={i} value={i}>{q.name}</option>)}</select>
          <div style={{marginTop:8}}>
            <Row label="Local sun" value={isDay?`day · ${(Math.acos(Math.min(1,Math.max(-1,cosX)))*180/Math.PI).toFixed(0)}° zen`:"night"} color={isDay?"#d29922":"#58a6ff"}/>
            <Row label="Sub-solar point" value={`${sun.lat.toFixed(1)}°, ${sun.lon.toFixed(1)}°`}/>
          </div>
        </Card>

        <Card title="◉ Ionosphere — measured vs model" tag={iono?"GIRO":"—"} tagClass={iono?"b-good":"b-off"}>
          <div className="stat-grid">
            <Stat label={"foF2 "+(closest?"@"+closest.code:"(model)")} value={closest?closest.fof2.toFixed(1):(foF2!=null?foF2.toFixed(1):"—")} unit="MHz" color={foF2Color(closest?closest.fof2:foF2)}/>
            <Stat label="MUF(3000)" value={closest&&closest.muf?closest.muf.toFixed(1):(muf3000!=null?muf3000.toFixed(1):"—")} unit="MHz" color="#3fb950"/>
          </div>
          <div style={{marginTop:8}}>
            {closest && <Row label={"Nearest sonde ("+Math.round(closest.d)+" km)"} value={closest.name} color="#58a6ff"/>}
            {closest && <Row label="Measurement age" value={ageLabel(closest.time)}/>}
            {closest && closest.tec!=null && <Row label="TEC" value={closest.tec.toFixed(1)+" TECu"}/>}
            <Row label="Model foF2 / MUF3000" value={`${foF2!=null?foF2.toFixed(1):"—"} / ${muf3000!=null?muf3000.toFixed(1):"—"} MHz`}/>
          </div>
          <div style={{fontSize:9,color:"#6e7681",marginTop:5}}>Measured = nearest GIRO ionosonde. Model = SFI/Kp + sun-angle estimate. They diverge → trust the sonde.</div>
        </Card>

        <Card title="◉ Nearest Ionosondes (live)" tag={iono?iono.length+" stns":"—"} tagClass={iono?"b-good":"b-off"}>
          <table className="tbl"><thead><tr><th>Station</th><th>foF2</th><th>MUF</th><th>km</th><th>age</th></tr></thead><tbody>
            {nearIono.map((s,i)=><tr key={i}><td style={{color:"#c9d1d9"}}><span className="dot-leg" style={{background:foF2Color(s.fof2)}}></span>{s.code}</td>
              <td style={{color:foF2Color(s.fof2),fontWeight:700}}>{s.fof2.toFixed(1)}</td><td>{s.muf?s.muf.toFixed(1):"—"}</td><td className="muted">{Math.round(s.d)}</td><td className="muted">{ageLabel(s.time)}</td></tr>)}
            {!nearIono.length&&<tr><td colSpan="5" className="muted">loading ionosonde network…</td></tr>}
          </tbody></table>
        </Card>

        <Card title="◉ D-Layer Absorption" tag="D-RAP est" tagClass={sw?.ok.xray1?"b-good":"b-off"} right={<span className="muted" style={{fontSize:9,marginRight:8}}>HAF {haf.toFixed(1)} MHz</span>}>
          {BANDS.filter(b=>b.freq<30).map(b=>{const abs=dLayerAbsorption(b.freq,haf);const col=abs>10?"#f85149":abs>3?"#d29922":"#3fb950";
            return <div className="dlayer-row" key={b.name}><span className="dlayer-name">{b.name}</span>
              <span className="dlayer-track"><span className="dlayer-fill" style={{width:Math.min(100,abs/15*100)+"%",background:col}}></span></span>
              <span className="dlayer-val">{abs.toFixed(1)} dB</span></div>;})}
          <div style={{fontSize:9,color:"#6e7681",marginTop:5}}>From live GOES X-ray flux + sun angle at QTH. {isDay?"":"Night: D-layer mostly absent."}</div>
        </Card>

        <Card title="◉ Band Conditions" tag={isDay?"DAY":"NIGHT"} tagClass={isDay?"b-fair":"b-info"}>
          <div className="band-grid">{BANDS.map(b=>{const c=bandCondition(b,sfi??70,kp??0,cosX);
            return <div className="band-cell" key={b.name}><div className="band-name" style={{color:b.color}}>{b.name}</div><div className="band-freq">{b.freq} MHz</div>
              <div className="band-status" style={{color:c.t==="GOOD"?"#0d1117":c.c,background:c.t==="GOOD"?"#3fb950":c.c+"22"}}>{c.t}</div></div>;})}</div>
        </Card>

        <Card title="◉ PSK Reporter Spots" tag={spots?spots.length+" rx":(spotErr?"PROXY?":"OFF")} tagClass={spots?"b-good":(spotErr?"b-fair":"b-off")}>
          <div style={{display:"flex",gap:6}}>
            <input className="input-field" style={{flex:1}} placeholder="callsign" value={callsign} onChange={e=>setCallsign(e.target.value)}/>
            <select className="input-field" style={{width:120}} value={spotDir} onChange={e=>setSpotDir(e.target.value)}>
              <option value="sender">who heard me</option><option value="receiver">who I heard</option></select>
          </div>
          <label className="fld">CORS proxy URL (optional — needed for browser)</label>
          <input className="input-field" placeholder="https://your-worker.dev/?url={url}" value={proxy} onChange={e=>setProxy(e.target.value)}/>
          <div style={{display:"flex",gap:6,marginTop:8,alignItems:"center"}}>
            <button className="btn btn-go btn-sm" onClick={fetchSpots} disabled={spotsLoading}>{spotsLoading?<span className="spinner"></span>:"FETCH SPOTS"}</button>
            <a className="muted" style={{fontSize:9}} href={`https://pskreporter.info/pskmap.html?preset&callsign=${callsign}`} target="_blank" rel="noopener">open on pskreporter ↗</a>
          </div>
          {spotErr && <div style={{fontSize:9,color:"#d29922",marginTop:6}}>⚠ {spotErr}. PSK Reporter has no CORS header — set a proxy above (see the Cloudflare Worker snippet I shared).</div>}
          {spots && <div style={{marginTop:8}}>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>{spotBands.map(([b,n])=><span key={b} className="badge b-info">{b}: {n}</span>)}</div>
            <table className="tbl"><thead><tr><th>{spotDir==="sender"?"heard by":"station"}</th><th>band</th><th>mode</th><th>snr</th><th>km</th></tr></thead><tbody>
              {spots.slice(0,12).map((s,i)=>{const g=spotDir==="sender"?s.rxGrid:s.txGrid;const ll=gridToLatLon(g);
                const dist=ll?Math.round(gcDist(qth.lat,qth.lon,ll.lat,ll.lon)):"";const call=spotDir==="sender"?s.rx:s.tx;
                return <tr key={i}><td style={{color:"#c9d1d9"}}>{call}</td><td>{bandOf(s.freq)}</td><td className="muted">{s.mode}</td><td>{s.snr}</td><td className="muted">{dist}</td></tr>;})}
            </tbody></table></div>}
          {!spots&&!spotErr&&<div style={{fontSize:9,color:"#6e7681",marginTop:6}}>Enter your callsign and (if running in a browser) a CORS proxy, then FETCH. Spots draw great-circle paths on the map.</div>}
        </Card>
      </div>
    </div>

    {/* BIG MAP */}
    <Card title="◉ Propagation Map — greyline · ionosondes · aurora · spots" tag="LIVE" tagClass="b-good"
      right={<div className="muted" style={{fontSize:9,marginRight:8}}>foF2 dots = measured · lines = spot paths</div>}>
      <div style={{position:"relative"}}>
        <PropMap qth={qth} iono={iono} aurora={sw?.aurora} spots={spots} spotDir={spotDir} layers={layers}/>
        <div className="map-toggles">
          <button className={"map-tg"+(layers.iono?" on":"")} onClick={()=>tg("iono")}>● ionosondes</button>
          <button className={"map-tg"+(layers.aurora?" on":"")} onClick={()=>tg("aurora")}>● aurora</button>
          <button className={"map-tg"+(layers.spots?" on":"")} onClick={()=>tg("spots")}>● spots</button>
        </div>
        <div className="map-legend">◐ terminator · ◉ sun · ◉ QTH<br/>foF2: <span style={{color:"#3b6fd6"}}>low</span> → <span style={{color:"#3fb950"}}>mid</span> → <span style={{color:"#f85149"}}>high</span></div>
      </div>
    </Card>

    <div className="footer">
      <div>DATA · NOAA SWPC · GIRO/KC2G ionosondes (prop.kc2g.com) · PSK Reporter · Kyoto Dst · GOES · DSCOVR</div>
      <div>HAMRADIO COMMANDER v3 · {callsign} · last sync {lastFetch?lastFetch.toUTCString().slice(17,25)+"Z":"—"} · auto-refresh 5 min<span className="caret"></span></div>
    </div>
  </div>;
}

function ageLabel(iso){if(!iso)return "—";const t=parseTime(iso);if(!t)return "—";
  const m=Math.round((Date.now()-t)/60000);if(m<1)return "now";if(m<60)return m+"m";if(m<1440)return Math.round(m/60)+"h";return Math.round(m/1440)+"d";}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
